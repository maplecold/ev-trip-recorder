<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#ffffff"/>

  <text x="40" y="46" font-size="20" font-weight="700" fill="#111827">Trip state machine</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">A trip only ends after the vehicle has been parked continuously for 5 minutes.</text>

  <!-- Parked -->
  <rect x="50" y="130" width="190" height="92" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="145" y="168" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">PARKED</text>
  <text x="145" y="190" font-size="11.5" fill="#6b7280" text-anchor="middle">no active trip</text>
  <text x="145" y="207" font-size="11.5" fill="#6b7280" text-anchor="middle">baseline = current frame</text>

  <!-- Driving -->
  <rect x="355" y="130" width="200" height="92" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="455" y="168" font-size="15" font-weight="600" fill="#1e3a8a" text-anchor="middle">DRIVING</text>
  <text x="455" y="190" font-size="11.5" fill="#1d4ed8" text-anchor="middle">trip active · route growing</text>
  <text x="455" y="207" font-size="11.5" fill="#1d4ed8" text-anchor="middle">energy integrating</text>

  <!-- Pending parking -->
  <rect x="665" y="130" width="190" height="92" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="760" y="162" font-size="15" font-weight="600" fill="#78350f" text-anchor="middle">PENDING PARK</text>
  <text x="760" y="184" font-size="11.5" fill="#92400e" text-anchor="middle">remembered timestamp</text>
  <text x="760" y="201" font-size="11.5" fill="#92400e" text-anchor="middle">(potential end time)</text>

  <!-- Parked -> Driving -->
  <path d="M 240 176 L 348 176" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowStart)"/>
  <text x="252" y="120" font-size="11.5" fill="#2563eb">frame classified as driving</text>
  <text x="252" y="136" font-size="11" fill="#6b7280">gear D/R, speed &gt; 0</text>

  <!-- Driving -> Pending -->
  <path d="M 555 176 L 658 176" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="120" font-size="11.5" fill="#b45309">first parked frame</text>
  <text x="566" y="136" font-size="11" fill="#6b7280">start the 5-minute timer</text>

  <!-- Pending -> Driving (resume) -->
  <path d="M 760 130 C 760 86, 455 86, 455 126" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="520" y="78" font-size="11.5" fill="#374151" text-anchor="middle">driving again before 5 min → same trip continues</text>

  <!-- Pending -> Done -->
  <path d="M 760 222 L 760 300" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="772" y="262" font-size="11.5" fill="#047857">still parked ≥ 5 min</text>

  <!-- Done -->
  <rect x="630" y="306" width="260" height="92" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="760" y="342" font-size="15" font-weight="600" fill="#064e3b" text-anchor="middle">TRIP FINISHED</text>
  <text x="760" y="364" font-size="11.5" fill="#065f46" text-anchor="middle">endedAt = the pending timestamp</text>
  <text x="760" y="381" font-size="11.5" fill="#065f46" text-anchor="middle">distance + energy resolved</text>

  <!-- Start marker -->
  <circle cx="50" cy="176" r="5" fill="#9ca3af"/>
  <text x="58" y="160" font-size="11" fill="#6b7280">start</text>
</svg>
